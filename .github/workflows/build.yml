name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check the Android SDK
        run: echo "$ANDROID_HOME" && ls $ANDROID_HOME/build-tools
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Prepare the web files
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          echo "window.CT_BUILD = ${{ github.run_number }};" > www/version.js
      - name: Create the Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#141312' --iconBackgroundColorDark '#141312' --splashBackgroundColor '#141312' --splashBackgroundColorDark '#141312'
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > key.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks key.p12 --ks-type PKCS12 --ks-pass env:KEYSTORE_PASS --out ComicTracker.apk aligned.apk
          $BT/apksigner verify --print-certs ComicTracker.apk | head -3
          rm key.p12
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.${{ github.run_number }}" ComicTracker.apk --title "Comic Tracker 1.${{ github.run_number }}" --notes "Install ComicTracker.apk on your Android phone. Updates install over the old version and keep your library."
